name: MVP Continuous Integration

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Run Linter
        run: cd backend && npm run lint

      - name: Run Unit Tests with Coverage
        run: cd backend && npm run test:coverage

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: vladimirticona/mis-patitas-backend:${{ github.ref_name }}

      - name: Update GitOps Repo
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/vladimirticona/Repositorio-de-configuracion.git gitops
          cd gitops
          sed -i "s|image: vladimirticona/mis-patitas-backend:.*|image: vladimirticona/mis-patitas-backend:${{ github.ref_name }}|" deployment.yaml
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git add deployment.yaml
          git commit -m "ci: update image tag to ${{ github.ref_name }}"
          git push